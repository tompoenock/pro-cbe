
<div [class]="darkMode ? 'min-h-screen bg-slate-950 text-white transition-colors duration-300' : 'min-h-screen bg-gradient-to-br from-emerald-50 via-white to-blue-50 text-gray-900 transition-colors duration-300'" class="relative overflow-hidden">

  <!-- Decorative school-themed background elements -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <!-- Graduation cap top-left -->
    <div [class]="darkMode ? 'absolute -top-10 -left-10 text-slate-800/20' : 'absolute -top-10 -left-10 text-emerald-100/50'" class="transform -rotate-12">
      <svg class="w-48 h-48" fill="currentColor" viewBox="0 0 640 512">
        <path d="M320 32c-8.1 0-16.1 1.4-23.7 4.1L15.8 137.4C6.3 140.9 0 149.9 0 160s6.3 19.1 15.8 22.6l57.9 20.9C57.3 229.3 48 259.8 48 291.9c0 28.6 10.6 54.4 27.7 72.5c-8.7 12.4-14.1 27.8-14.1 44.8c0 45.5 41.6 70.8 82.9 70.8c33.5 0 62.8-17.7 77.1-41.1c10.1 5.1 21.2 8.1 33.1 8.1c47.4 0 90-28.5 107.1-69.4c5.5-13.1 8.6-27.4 8.6-42.6c0-11.1-1.5-21.9-4.2-32.1L623.3 182.6C633.7 179.1 640 170.1 640 160s-6.3-19.1-15.8-22.6L343.7 36.1C336.1 33.4 328.1 32 320 32zM128 384c0 17.7-14.3 32-32 32s-32-14.3-32-32c0-24.8 11.9-46.9 30.2-60.8c2.2 12.1 6.1 23.5 11.5 34.1c5.1 10.1 12.2 19.4 20.7 27.6c1.1 10.4 1.7 20.8 1.7 31.1zm288-32c0 30.1-13.3 57.2-34.5 76.1c-15.5 13.8-34.9 23.1-56.4 26.5c-1.5-6.8-3.5-13.4-6.1-19.7c6.5-3.7 12.6-8.1 18.1-13.1c16.7-15 29-35.5 35.1-58.8c2.5-9.4 3.9-19.2 3.9-29.3c0-5.5-.4-10.9-1.1-16.1c14.4-15.9 24-38 28-62.2c16.7-5.5 31.5-14.8 43.7-26.9c1.3 14.6 2.3 29.4 2.3 44.5c0 10.9-.8 21.6-2.3 32z"/>
      </svg>
    </div>
    <!-- Books bottom-right -->
    <div [class]="darkMode ? 'absolute bottom-10 right-10 text-slate-800/20' : 'absolute bottom-10 right-10 text-emerald-100/50'" class="transform rotate-12">
      <svg class="w-40 h-40" fill="currentColor" viewBox="0 0 448 512">
        <path d="M96 0C43 0 0 43 0 96V416c0 53 43 96 96 96H384h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V384c17.7 0 32-14.3 32-32V32c0-17.7-14.3-32-32-32H384 96zm0 384H352v64H96c-17.7 0-32-14.3-32-32s14.3-32 32-32zm32-240c0-8.8 7.2-16 16-16H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16zm16 48H336c8.8 0 16 7.2 16 16s-7.2 16-16 16H144c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/>
      </svg>
    </div>
    <!-- Pencil top-right -->
    <div [class]="darkMode ? 'absolute top-20 right-20 text-slate-800/20' : 'absolute top-20 right-20 text-emerald-100/50'" class="transform rotate-45">
      <svg class="w-32 h-32" fill="currentColor" viewBox="0 0 512 512">
        <path d="M410.3 231l11.3-11.3-33.9-33.9-62.1-62.1L291.7 89.8l-11.3 11.3-22.6 22.6L58.6 322.9c-10.4 10.4-18 23.3-22.2 37.4L1 480.7c-2.5 8.4-.2 17.5 6.1 23.7s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L387.7 253.7 410.3 231zM160 399.4l-9.1 22.7c-4 3.1-8.5 5.4-13.3 6.9L59.4 452l23-78.1c1.4-4.9 3.8-9.4 6.9-13.3l22.7-9.1v32c0 8.8 7.2 16 16 16h32zM362.7 18.7L348.3 33.2 325.7 55.8 314.3 67.1l33.9 33.9 62.1 62.1 33.9 33.9 11.3-11.3 22.6-22.6 14.5-14.5c25-25 25-65.5 0-90.5L453.3 18.7c-25-25-65.5-25-90.5 0zm-47.4 168l-144 144c-6.2 6.2-16.4 6.2-22.6 0s-6.2-16.4 0-22.6l144-144c6.2-6.2 16.4-6.2 22.6 0s6.2 16.4 0 22.6z"/>
      </svg>
    </div>
  </div>

  <!-- Dark/Light Mode Switcher (Dashboard style, top right) -->
  <div class="absolute top-6 right-8 z-50">
    <button type="button" (click)="toggleTheme()" [class]="darkMode ? 'p-2 rounded-lg transition-colors hover:bg-slate-700 text-yellow-400' : 'p-2 rounded-lg transition-colors hover:bg-gray-100 text-gray-500'" [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="darkMode" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
      <svg *ngIf="!darkMode" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
      </svg>
    </button>
  </div>

  <div class="flex items-center justify-center min-h-screen px-4 py-8">
    <div class="w-full max-w-md">
      <div [class]="darkMode ? 'bg-slate-800/90 backdrop-blur-sm text-slate-100 rounded-2xl shadow-2xl px-8 pt-10 pb-8 space-y-6 transition-colors duration-300 border border-slate-700' : 'bg-white/90 backdrop-blur-sm text-gray-900 rounded-2xl shadow-xl px-8 pt-10 pb-8 space-y-6 transition-colors duration-300 border border-gray-200'">

      <!-- Logo & Title -->
      <div class="flex flex-col items-center space-y-3">
        <div [class]="darkMode ? 'w-20 h-20 rounded-full bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center shadow-lg' : 'w-20 h-20 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow-md'">
          <!-- Graduation cap icon for school theme -->
          <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 640 512">
            <path d="M320 32c-8.1 0-16.1 1.4-23.7 4.1L15.8 137.4C6.3 140.9 0 149.9 0 160s6.3 19.1 15.8 22.6L320 302.6 624.2 182.6c9.5-3.5 15.8-12.5 15.8-22.6s-6.3-19.1-15.8-22.6L343.7 36.1C336.1 33.4 328.1 32 320 32zM128 384c0 35.3 85.9 96 192 96s192-60.7 192-96l0-101.4-139.5 49.8c-16.6 5.9-34.1 9-52.5 9s-35.9-3.1-52.5-9L128 282.6V384z"/>
          </svg>
        </div>
        <div class="text-center">
          <h2 [class]="darkMode ? 'text-white text-2xl font-bold tracking-wide' : 'text-emerald-700 text-2xl font-bold tracking-wide'">CBE PATHWAY SYSTEM</h2>
          <p [class]="darkMode ? 'text-slate-400 text-sm mt-1' : 'text-gray-500 text-sm mt-1'">Discover &bull; Track &bull; Excel</p>
        </div>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" class="space-y-5">

        <!-- Login Type selection removed; role is determined from the saved user record in the database -->
        <!--
        <div class="grid grid-cols-2 gap-3">
          <label [class]="darkMode ? 'inline-flex items-center space-x-2 text-sm font-medium text-slate-200' : 'inline-flex items-center space-x-2 text-sm font-medium text-gray-600'">
            <input type="radio" name="loginType" [(ngModel)]="loginType" value="user" />
            <span>User</span>
          </label>
          <label [class]="darkMode ? 'inline-flex items-center space-x-2 text-sm font-medium text-slate-200' : 'inline-flex items-center space-x-2 text-sm font-medium text-gray-600'">
            <input type="radio" name="loginType" [(ngModel)]="loginType" value="parent" />
            <span>Parent</span>
          </label>
        </div>
        -->

        <!-- Email -->
        <div>
          <label for="email" [class]="darkMode ? 'block text-sm font-medium text-slate-200 mb-1.5' : 'block text-sm font-medium text-gray-600 mb-1.5'">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            #emailInput="ngModel"
            placeholder="Enter your Gmail"
            [class]="darkMode ? 'w-full px-4 py-2.5 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-slate-900 text-slate-100 transition' : 'w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-white text-gray-900 transition'"
          />
          <div *ngIf="loginForm.submitted && emailInput.invalid" [class]="darkMode ? 'text-red-400 text-xs mt-1' : 'text-red-500 text-xs mt-1'">
            Valid email is required.
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" [class]="darkMode ? 'block text-sm font-medium text-slate-200 mb-1.5' : 'block text-sm font-medium text-gray-600 mb-1.5'">Password</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              required
              minlength="6"
              #passwordInput="ngModel"
              placeholder="********"
              [class]="darkMode ? 'w-full px-4 py-2.5 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 pr-11 bg-slate-900 text-slate-100 transition' : 'w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 pr-11 bg-white text-gray-900 transition'"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              [class]="darkMode ? 'absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-200 cursor-pointer' : 'absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 cursor-pointer'"
            >
              <!-- Eye icon (show) -->
              <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <!-- Eye-slash icon (hide) -->
              <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
          <div *ngIf="loginForm.submitted && passwordInput.invalid" [class]="darkMode ? 'text-red-400 text-xs mt-1' : 'text-red-500 text-xs mt-1'">
            Password is required (min 6 characters).
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loading"
          [class]="darkMode ? 'w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm' : 'w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm'"
        >
          {{ loading ? 'Signing in...' : 'Login' }}
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-3">
          <div [class]="darkMode ? 'flex-1 h-px bg-slate-700' : 'flex-1 h-px bg-gray-200'"></div>
          <span [class]="darkMode ? 'text-slate-400 text-xs' : 'text-gray-400 text-xs'">or</span>
          <div [class]="darkMode ? 'flex-1 h-px bg-slate-700' : 'flex-1 h-px bg-gray-200'"></div>
        </div>

        <!-- Google Login -->
        <button
          type="button"
          [class]="darkMode ? 'w-full flex items-center justify-center gap-2.5 border border-slate-700 rounded-lg py-2.5 text-sm font-medium text-slate-100 hover:bg-slate-700 transition-colors duration-200 bg-slate-900' : 'w-full flex items-center justify-center gap-2.5 border border-gray-300 rounded-lg py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors duration-200 bg-white'"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Login with Google
        </button>

        <!-- Links -->
        <div class="flex justify-center items-center text-sm">
          <!-- Forgot Password commented out
          <a routerLink="/forgot-password" class="text-gray-500 hover:text-emerald-600 transition-colors">Forgot Password?</a>
          -->
          <a routerLink="/register" class="text-emerald-600 font-semibold hover:text-emerald-700 transition-colors">Register</a>
        </div>

        <!-- Error / Pending Approval Notice -->
        <div *ngIf="errorMessage && errorMessage.includes('pending approval')" class="bg-amber-50 border border-amber-200 rounded-lg p-3">
          <div class="flex items-center gap-2 text-amber-700 text-sm">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            <span>{{ errorMessage }}</span>
          </div>
        </div>
        <div *ngIf="errorMessage && !errorMessage.includes('pending approval')" class="text-red-600 text-center text-sm bg-red-50 border border-red-200 rounded-lg p-3">
          {{ errorMessage }}
        </div>
      </form>
    </div>

    <!-- Footer Brand -->
    <div class="flex items-center justify-center gap-2 mt-6 text-gray-400 text-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
      </svg>
      <span>CBE PATHWAY SYSTEM</span>
    </div>
  </div>
</div>
