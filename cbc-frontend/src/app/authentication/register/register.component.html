<div [class]="darkMode ? 'min-h-screen bg-slate-950 text-white transition-colors duration-300' : 'min-h-screen bg-gray-50 text-gray-900 transition-colors duration-300'" class="relative">
  <!-- Theme Switcher -->
  <div class="absolute top-6 right-8 z-50">
    <button type="button" (click)="toggleTheme()" [class]="darkMode ? 'p-2 rounded-lg transition-colors hover:bg-slate-700 text-yellow-400' : 'p-2 rounded-lg transition-colors hover:bg-gray-100 text-gray-500'" [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="darkMode" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
      <svg *ngIf="!darkMode" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
      </svg>
    </button>
  </div>

  <div class="flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md">
      <div [class]="darkMode ? 'bg-slate-800 text-slate-100 rounded-2xl shadow-2xl px-8 pt-10 pb-8 space-y-6 transition-colors duration-300 border border-slate-700' : 'bg-white text-gray-900 rounded-2xl shadow-lg px-8 pt-10 pb-8 space-y-6 transition-colors duration-300 border border-gray-200'">

        <!-- Title -->
        <h2 [class]="darkMode ? 'text-white text-2xl font-bold tracking-wide italic' : 'text-blue-600 text-2xl font-bold tracking-wide italic'">Create Account</h2>
        <p [class]="darkMode ? 'text-sm text-center text-slate-400' : 'text-sm text-center text-gray-500'">Register for a school account</p>

        <!-- Success Message -->
        <div *ngIf="registrationComplete" [class]="darkMode ? 'bg-green-900/30 border border-green-700 rounded-lg p-4' : 'bg-green-50 border border-green-200 rounded-lg p-4'">
          <p [class]="darkMode ? 'text-green-300 text-sm text-center' : 'text-green-700 text-sm text-center'">{{ successMessage }}</p>
          <div class="text-center mt-3">
            <a routerLink="/login" [class]="darkMode ? 'text-emerald-400 hover:underline text-sm font-medium' : 'text-blue-600 hover:underline text-sm font-medium'">Go to Login</a>
          </div>
        </div>

        <!-- Register Form -->
        <form *ngIf="!registrationComplete" (ngSubmit)="onSubmit(registerForm)" #registerForm="ngForm" class="space-y-4">

          <!-- Username -->
          <div>
            <label for="username" [class]="darkMode ? 'block text-sm font-medium text-slate-200 mb-1' : 'block text-sm font-medium text-gray-700 mb-1'">Full Name</label>
            <input
              type="text"
              id="username"
              name="username"
              [(ngModel)]="username"
              required
              #usernameInput="ngModel"
              placeholder="John Doe"
              [class]="darkMode ? 'w-full px-4 py-2.5 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-slate-900 text-slate-100 transition' : 'w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-900 transition'"
            />
            <div *ngIf="registerForm.submitted && usernameInput.invalid" [class]="darkMode ? 'text-red-400 text-xs mt-1' : 'text-red-500 text-xs mt-1'">
              Full name is required.
            </div>
          </div>

          <!-- Phone -->
          <div>
            <label for="phone_no" [class]="darkMode ? 'block text-sm font-medium text-slate-200 mb-1' : 'block text-sm font-medium text-gray-700 mb-1'">Phone Number</label>
            <input
              type="tel"
              id="phone_no"
              name="phone_no"
              [(ngModel)]="phone_no"
              required
              #phoneInput="ngModel"
              placeholder="+254700000000"
              [class]="darkMode ? 'w-full px-4 py-2.5 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-slate-900 text-slate-100 transition' : 'w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-900 transition'"
            />
            <div *ngIf="registerForm.submitted && phoneInput.invalid" [class]="darkMode ? 'text-red-400 text-xs mt-1' : 'text-red-500 text-xs mt-1'">
              Phone number is required.
            </div>
          </div>

          <!-- Role -->
          <div>
            <label [class]="darkMode ? 'block text-sm font-medium text-slate-200 mb-1' : 'block text-sm font-medium text-gray-700 mb-1'">Account Type</label>
            <div class="grid grid-cols-2 gap-3">
              <label [class]="darkMode ? 'inline-flex items-center space-x-2 text-sm text-slate-200' : 'inline-flex items-center space-x-2 text-sm text-gray-700'">
                <input
                  type="radio"
                  name="role"
                  [(ngModel)]="role"
                  [value]="Role.User"
                  [class]="darkMode ? 'form-radio text-emerald-500 bg-slate-900 border-slate-600' : 'form-radio text-blue-600'"
                />
                <span>User</span>
              </label>
              <label [class]="darkMode ? 'inline-flex items-center space-x-2 text-sm text-slate-200' : 'inline-flex items-center space-x-2 text-sm text-gray-700'">
                <input
                  type="radio"
                  name="role"
                  [(ngModel)]="role"
                  [value]="Role.Parent"
                  [class]="darkMode ? 'form-radio text-emerald-500 bg-slate-900 border-slate-600' : 'form-radio text-blue-600'"
                />
                <span>Parent</span>
              </label>
            </div>
          </div>

          <!-- Email -->
          <div>
            <label for="email" [class]="darkMode ? 'block text-sm font-medium text-slate-200 mb-1' : 'block text-sm font-medium text-gray-700 mb-1'">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              required
              email
              #emailInput="ngModel"
              placeholder="you&#64;example.com"
              [class]="darkMode ? 'w-full px-4 py-2.5 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 bg-slate-900 text-slate-100 transition' : 'w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-900 transition'"
            />
            <div *ngIf="registerForm.submitted && emailInput.invalid" [class]="darkMode ? 'text-red-400 text-xs mt-1' : 'text-red-500 text-xs mt-1'">
              Valid email is required.
            </div>
          </div>

          <!-- Password -->
          <div class="relative">
            <label for="password" [class]="darkMode ? 'block text-sm font-medium text-slate-200 mb-1' : 'block text-sm font-medium text-gray-700 mb-1'">Password</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              required
              minlength="6"
              #passwordInput="ngModel"
              placeholder="********"
              [class]="darkMode ? 'w-full px-4 py-2.5 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 pr-11 bg-slate-900 text-slate-100 transition' : 'w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-11 bg-white text-gray-900 transition'"
            />
            <button type="button" (click)="showPassword = !showPassword"
              [class]="darkMode ? 'absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-200 cursor-pointer' : 'absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 cursor-pointer'">
              <svg *ngIf="!showPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
              <svg *ngIf="showPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
            <div *ngIf="registerForm.submitted && passwordInput.invalid" [class]="darkMode ? 'text-red-400 text-xs mt-1' : 'text-red-500 text-xs mt-1'">
              Password is required (min 6 characters).
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="relative">
            <label for="confirmPassword" [class]="darkMode ? 'block text-sm font-medium text-slate-200 mb-1' : 'block text-sm font-medium text-gray-700 mb-1'">Confirm Password</label>
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              #confirmPasswordInput="ngModel"
              placeholder="********"
              [class]="darkMode ? 'w-full px-4 py-2.5 border border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 pr-11 bg-slate-900 text-slate-100 transition' : 'w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-11 bg-white text-gray-900 transition'"
            />
            <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
              [class]="darkMode ? 'absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-200 cursor-pointer' : 'absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 cursor-pointer'">
              <svg *ngIf="!showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
              <svg *ngIf="showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
            <div *ngIf="registerForm.submitted && password !== confirmPassword" [class]="darkMode ? 'text-red-400 text-xs mt-1' : 'text-red-500 text-xs mt-1'">
              Passwords do not match.
            </div>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            [disabled]="submitting"
            [class]="darkMode ? 'w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm' : 'w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm'"
          >
            {{ submitting ? 'Registering...' : 'Register' }}
          </button>

          <!-- Link -->
          <div [class]="darkMode ? 'text-center text-sm mt-2 text-slate-400' : 'text-center text-sm mt-2 text-gray-600'">
            Already have an account?
            <a routerLink="/login" [class]="darkMode ? 'text-emerald-400 hover:underline font-medium' : 'text-blue-600 hover:underline font-medium'">Login</a>
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" [class]="darkMode ? 'text-red-400 text-center mt-3 text-sm' : 'text-red-600 text-center mt-3 text-sm'">
            {{ errorMessage }}
          </div>
        </form>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-center gap-2 mt-6" [class]="darkMode ? 'text-slate-500 text-sm' : 'text-gray-400 text-sm'">
        SCHOOL SYSTEM
      </div>
    </div>
  </div>
</div>
